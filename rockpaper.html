<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rock Paper Scissors</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="rockpaper.css">
</head>
<body class="min-h-screen bg-indigo-950 text-white flex items-center justify-center p-4">
  <main class="w-full max-w-md rounded-3xl bg-slate-900 p-6 text-center">
    <h1 class="text-3xl font-bold text-fuchsia-400">Rock, Paper, Scissors</h1>
    <p class="mt-3 text-slate-300">Choose your move!</p>

    <div class="mt-6 grid grid-cols-3 gap-3">
      <button class="choice" data-choice="rock">✊<br>Rock</button>
      <button class="choice" data-choice="paper">✋<br>Paper</button>
      <button class="choice" data-choice="scissors">✌️<br>Scissors</button>
    </div>

    <div class="mt-6 rounded-xl bg-slate-800 p-4">
      <p id="moves">Your move: — | Computer: —</p>
      <h2 id="result" class="mt-4 text-xl font-bold">Make your choice!</h2>
    </div>

    <p class="mt-5">Wins: <span id="wins">0</span></p>
    <p>Draws: <span id="draws">0</span></p>
    <p>Losses: <span id="losses">0</span></p>

    <button id="reset"
      class="mt-5 w-full rounded-xl bg-fuchsia-500 p-3 font-bold">
      Reset Score
    </button>
  </main>

  <script src="rockpaper.js"></script>
</body>
</html>
